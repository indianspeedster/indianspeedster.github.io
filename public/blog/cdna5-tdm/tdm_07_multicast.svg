<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="system-ui, -apple-system, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 Z" fill="#1e1e1e"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<text x="40" y="44.7" font-size="26" text-anchor="start" fill="#1e1e1e" font-weight="bold">Multicast: one trip to memory, up to 16 LDS destinations</text>
<rect x="50" y="200" width="170" height="110" rx="12" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="135.0" y="249.4" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="normal">Global memory</text>
<text x="135.0" y="266.9" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="normal">the shared A-panel</text>
<line x1="220" y1="255" x2="300" y2="255" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)" />
<rect x="300" y="196" width="210" height="118" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="405.0" y="241.68" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">TDM</text>
<text x="405.0" y="257.93" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">workgroup_mask ≠ 0</text>
<text x="405.0" y="274.18" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="bold">→ CLUSTER_LOAD_ASYNC</text>
<line x1="510" y1="255" x2="700" y2="136" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)" />
<rect x="700" y="110" width="210" height="52" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="805.0" y="139.15" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="normal">LDS — workgroup 0</text>
<line x1="510" y1="255" x2="700" y2="216" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)" />
<rect x="700" y="190" width="210" height="52" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="805.0" y="219.15" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="normal">LDS — workgroup 1</text>
<line x1="510" y1="255" x2="700" y2="296" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)" />
<rect x="700" y="270" width="210" height="52" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="805.0" y="299.15" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="normal">LDS — workgroup 2</text>
<line x1="510" y1="255" x2="700" y2="376" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)" />
<rect x="700" y="350" width="210" height="52" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="805.0" y="379.15" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="normal">LDS — workgroup 3</text>
<text x="805" y="448" font-size="14" text-anchor="middle" fill="#868e96" font-weight="normal">…  up to 16 workgroups in the cluster</text>
<rect x="684" y="94" width="242" height="330" rx="12" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="6 5"/>
<text x="805" y="82" font-size="13" text-anchor="middle" fill="#868e96" font-weight="normal">workgroup cluster — one WGP each</text>
<text x="480" y="469.19" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">Load only — for TENSOR_STORE_FROM_LDS the mask is ignored.</text>
<text x="480" y="484.81" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">Every masked workgroup must make the same request; data returns when all have arrived or a timeout fires, so a badly</text>
<text x="480" y="500.44" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">skewed cluster degrades to no win rather than to a hang. workgroup_mask must be zero when the wave is not in a cluster.</text>
</svg>
