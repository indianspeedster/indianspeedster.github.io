<text x="310" y="462" font-size="13.5" text-anchor="middle" fill="#c92a2a" font-weight="bold">4 reads, 1 bank: the hardware serializes them</text>
<text x="810" y="150" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold" font-family="Excalifont, cursive">pad_amount field 0 means 1 DWORD</text>
<text x="810" y="172" font-size="12.5" text-anchor="middle" fill="#868e96" font-weight="normal">each row starts one slot later than the last</text>
<text x="628" y="217" font-size="12.5" text-anchor="end" fill="#868e96" font-weight="normal">row 0</text>
