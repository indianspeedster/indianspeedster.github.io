<text x="40" y="44.7" font-size="26" text-anchor="start" fill="#1e1e1e" font-weight="bold">Padding: how one wasted slot per row removes a bank conflict</text>
<text x="520" y="86.6" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">Four lanes in one wave read column 0 of different tile rows in one LDS instruction. Which bank each lane reaches decides</text>
<text x="520" y="103.47" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">whether they happen together or one after another.</text>
<text x="310" y="150" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="bold" font-family="Excalifont, cursive">no padding</text>
<text x="310" y="172" font-size="12.5" text-anchor="middle" fill="#868e96" font-weight="normal">a row is 64 DWORDs, so every row starts at bank 0</text>
<text x="128" y="217" font-size="12.5" text-anchor="end" fill="#868e96" font-weight="normal">row 0</text>
