<rect x="60" y="492" width="920" height="82" rx="12" fill="#fff9db" stroke="#e8590c" stroke-width="1.5"/>
<text x="520" y="520.19" font-size="12.5" text-anchor="middle" fill="#e8590c" font-weight="normal">The copy engine inserts the gap while it writes, so the skew costs nothing at copy time. Both settings are encoded rather than literal:</text>
<text x="520" y="535.81" font-size="12.5" text-anchor="middle" fill="#e8590c" font-weight="normal">pad_interval 0 means 2 DWORDs and pad_amount 0 means 1 DWORD, they must both be zero or both non-zero, and padding applies</text>
<text x="520" y="551.44" font-size="12.5" text-anchor="middle" fill="#e8590c" font-weight="normal">on the way into LDS only. There is no de-padding on the way back out.</text>
