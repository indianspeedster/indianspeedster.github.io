<text x="258.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">4</text>
<rect x="280" y="116" width="44" height="46" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="302.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">5</text>
<rect x="324" y="116" width="44" height="46" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="346.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">6</text>
<rect x="368" y="116" width="44" height="46" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="390.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">7</text>
<rect x="412" y="116" width="44" height="46" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="434.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">8</text>
<rect x="456" y="116" width="44" height="46" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="478.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">9</text>
<rect x="500" y="116" width="44" height="46" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="522.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">10</text>
<rect x="544" y="116" width="44" height="46" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="566.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">11</text>
<rect x="588" y="116" width="44" height="46" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="610.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">12</text>
<rect x="632" y="116" width="44" height="46" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="654.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">13</text>
<rect x="676" y="116" width="44" height="46" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="698.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">14</text>
<rect x="720" y="116" width="44" height="46" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="742.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">15</text>
<rect x="764" y="116" width="44" height="46" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="786.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">16</text>
<rect x="808" y="116" width="44" height="46" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="830.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">17</text>
<rect x="852" y="116" width="44" height="46" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="874.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">18</text>
<rect x="896" y="116" width="44" height="46" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="918.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">19</text>
<text x="48" y="144.0" font-size="13" text-anchor="end" fill="#868e96" font-weight="normal">SGPR</text>
<line x1="63" y1="171" x2="233" y2="171" stroke="#868e96" stroke-width="1.5"/>
<text x="148.0" y="189.0" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">group 0</text>
<text x="148.0" y="204.62" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">4 SGPRs · VADDR0</text>
<line x1="239" y1="171" x2="585" y2="171" stroke="#868e96" stroke-width="1.5"/>
<text x="412.0" y="189.0" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">group 1</text>
<text x="412.0" y="204.62" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">8 SGPRs · VADDR1</text>
<line x1="591" y1="171" x2="761" y2="171" stroke="#868e96" stroke-width="1.5"/>
<text x="676.0" y="189.0" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">group 2</text>
<text x="676.0" y="204.62" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">4 SGPRs · VADDR2</text>
<line x1="767" y1="171" x2="937" y2="171" stroke="#868e96" stroke-width="1.5"/>
<text x="852.0" y="189.0" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">group 3</text>
<text x="852.0" y="204.62" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal">4 SGPRs · VADDR3</text>
<line x1="588" y1="86" x2="588" y2="166" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="578" y="78" font-size="13" text-anchor="end" fill="#c92a2a" font-weight="normal">a 2D copy needs only these 12</text>
<text x="598" y="78" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="normal">up to 5D needs all 20</text>
<line x1="764" y1="208" x2="764" y2="268" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)" />
<text x="500" y="258" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="bold">what groups 2 and 3 hold depends on two mode bits:</text>
<text x="258" y="324" font-size="13.5" text-anchor="end" fill="#1e1e1e" font-weight="bold" font-family="Excalifont, cursive">no mode bit set</text>
<rect x="272" y="290" width="668" height="68" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="606.0" y="318.8" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal">tensor_dim2 · tensor_dim3 · tensor_dim4</text>
<text x="606.0" y="335.05" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal">tensor_dim2_stride · tensor_dim3_stride · tile_dim3 · tile_dim4</text>
<text x="258" y="410" font-size="13.5" text-anchor="end" fill="#1e1e1e" font-weight="bold" font-family="Excalifont, cursive">iterate_enable = 1</text>
<rect x="272" y="376" width="668" height="68" rx="12" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="606.0" y="404.8" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal">lds_addr_increment · global_addr_increment · iterate_count</text>
<text x="606.0" y="421.05" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal">the 4D and 5D fields are gone, so iteration is 2D and 3D only</text>
<text x="258" y="496" font-size="13.5" text-anchor="end" fill="#1e1e1e" font-weight="bold" font-family="Excalifont, cursive">gather_mode = 1</text>
<rect x="272" y="462" width="668" height="68" rx="12" fill="#ffe3e3" stroke="#1e1e1e" stroke-width="2"/>
<text x="606.0" y="490.8" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal">16 row indices at 16 bits each, or 8 at 32 bits</text>
<text x="606.0" y="507.05" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="normal">no tensor dimensions at all in these registers</text>
<text x="500" y="572.8" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">A 2D transfer points VADDR2 and VADDR3 at NULL and uses 12 registers. The two must both be NULL or both be set.</text>
<text x="500" y="589.05" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">Every field name above is listed in full in the appendix.</text>
</svg>
