<text x="126.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">1</text>
<rect x="148" y="116" width="44" height="46" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="170.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">2</text>
<rect x="192" y="116" width="44" height="46" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="214.0" y="144.0" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">3</text>
