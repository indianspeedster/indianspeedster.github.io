<text x="510" y="446.8" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">Rows arrive in the order the list names them, not in memory order: index 0 is row 9, so row 9 lands first.</text>
<text x="510" y="463.05" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">Repeats are allowed, which is why row 2 appears twice. Up to 16 indices fit at 16 bits each, or 8 at 32 bits.</text>
<rect x="96" y="490" width="828" height="54" rx="12" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
<text x="510" y="512.0" font-size="12.5" text-anchor="middle" fill="#c92a2a" font-weight="normal">An index past the end of the tensor gives a zero-filled row, but the manual only guarantees that when the list is</text>
<text x="510" y="527.62" font-size="12.5" text-anchor="middle" fill="#c92a2a" font-weight="normal">non-decreasing. With an order like this one, check the indices yourself before handing them over.</text>
