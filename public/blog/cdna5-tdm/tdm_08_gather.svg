<text x="500" y="492.19" font-size="12.5" text-anchor="middle" fill="#c92a2a" font-weight="normal">16 indices per instruction at 16 bits, 8 at 32 bits. 2D tiles only. The same index list turns TENSOR_STORE_FROM_LDS into a scatter.</text>
<text x="500" y="507.81" font-size="12.5" text-anchor="middle" fill="#c92a2a" font-weight="normal">The catch: indices may be arbitrary and may repeat, but out-of-bounds handling is only correct when each index is ≥ the previous one.</text>
<text x="500" y="523.44" font-size="12.5" text-anchor="middle" fill="#c92a2a" font-weight="normal">Unsorted indices — exactly what a token ID or an MoE routing decision gives you — mean you must guarantee every index is in range.</text>
