<text x="450" y="522.8" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">The stride counts the padding, which is how a row can be wider than its data. The bound is measured from global_addr,</text>
<text x="450" y="539.05" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">so it says how much tensor is left from the tile onwards rather than how wide the whole array is.</text>
