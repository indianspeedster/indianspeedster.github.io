<text x="165" y="472.16" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">2 instructions per chunk, plus a wait</text>
<text x="165" y="489.04" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">VGPRs: data and addresses</text>
<text x="165" y="505.91" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">counters: LOADcnt, then DScnt</text>
