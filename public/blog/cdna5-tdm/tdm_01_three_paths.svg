<text x="755" y="489.04" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">VGPRs: none</text>
<text x="755" y="505.91" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">counter: TENSORcnt</text>
