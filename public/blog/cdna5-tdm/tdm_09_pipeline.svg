<text x="580" y="388.04" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the wait is  ≤ N , not  = 0 : it retires the older transfer and lets the newer one keep running</text>
<text x="500" y="452.6" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">Per iteration the wave issues one instruction and two scalar adds to advance global_addr. The register file holds accumulators,</text>
<text x="500" y="469.48" font-size="13.5" text-anchor="middle" fill="#495057" font-weight="normal">not data in flight, and TENSORcnt is 6 bits wide — 63 outstanding transfers — so the counter will not be what limits your pipeline.</text>
