<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="610" viewBox="0 0 1060 610" font-family="Excalifont, cursive">
<style>@font-face{font-family:"Excalifont";src:url("../../fonts/Excalifont-Regular.ttf") format("truetype");font-style:normal;font-weight:100 900;font-display:block}text{font-family:"Excalifont",cursive}</style>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1e1e1e"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M8,0 L0,3 L8,6 Z" fill="#1e1e1e"/></marker></defs>
<rect width="1060" height="610" fill="#ffffff"/>
<text x="40" y="44.7" font-size="26" text-anchor="start" fill="#1e1e1e" font-weight="bold">One iteration: the next tile arrives while this one is computed</text>
<rect x="622" y="150" width="200" height="268" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="60" y="128" font-size="14" text-anchor="start" fill="#868e96" font-weight="normal">time</text>
<line x1="236" y1="142" x2="1008" y2="142" stroke="#868e96" stroke-width="1.5"/>
<text x="212" y="198" font-size="15" text-anchor="end" fill="#495057" font-weight="bold">TDM</text>
<text x="212" y="218" font-size="12" text-anchor="end" fill="#868e96" font-weight="normal">runs on its own</text>
<text x="212" y="378" font-size="15" text-anchor="end" fill="#495057" font-weight="bold">Matrix core</text>
<text x="212" y="398" font-size="12" text-anchor="end" fill="#868e96" font-weight="normal">waits on the counter</text>
<rect x="236" y="176" width="184" height="56" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="328.0" y="198.6" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">load tile 0</text>
<text x="328.0" y="215.47" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">into buffer A</text>
<rect x="432" y="176" width="184" height="56" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="524.0" y="198.6" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">load tile 1</text>
<text x="524.0" y="215.47" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">into buffer B</text>
<rect x="628" y="176" width="184" height="56" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="720.0" y="198.6" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">load tile 2</text>
<text x="720.0" y="215.47" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">into buffer A</text>
<rect x="824" y="176" width="184" height="56" rx="12" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
<text x="916.0" y="198.6" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">load tile 3</text>
<text x="916.0" y="215.47" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">into buffer B</text>
<rect x="432" y="356" width="184" height="56" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="524.0" y="378.6" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">compute tile 0</text>
<text x="524.0" y="395.48" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">from buffer A</text>
<line x1="444" y1="232" x2="444" y2="356" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)" />
<text x="454" y="260" font-size="11.5" text-anchor="start" fill="#495057" font-weight="normal" font-family="Excalifont, cursive">S_WAIT_TENSORCNT 1</text>
<text x="454" y="278" font-size="11.5" text-anchor="start" fill="#868e96" font-weight="normal">tile 0 has landed;</text>
<text x="454" y="294" font-size="11.5" text-anchor="start" fill="#868e96" font-weight="normal">tile 1 keeps moving</text>
<rect x="628" y="356" width="184" height="56" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="720.0" y="378.6" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">compute tile 1</text>
<text x="720.0" y="395.48" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">from buffer B</text>
<line x1="640" y1="232" x2="640" y2="356" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)" />
<text x="650" y="260" font-size="11.5" text-anchor="start" fill="#495057" font-weight="normal" font-family="Excalifont, cursive">S_WAIT_TENSORCNT 1</text>
<text x="650" y="278" font-size="11.5" text-anchor="start" fill="#868e96" font-weight="normal">tile 1 has landed;</text>
<text x="650" y="294" font-size="11.5" text-anchor="start" fill="#868e96" font-weight="normal">tile 2 keeps moving</text>
<rect x="824" y="356" width="184" height="56" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="916.0" y="378.6" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">compute tile 2</text>
<text x="916.0" y="395.48" font-size="13.5" text-anchor="middle" fill="#1e1e1e" font-weight="normal">from buffer A</text>
<line x1="836" y1="232" x2="836" y2="356" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)" />
<text x="846" y="260" font-size="11.5" text-anchor="start" fill="#495057" font-weight="normal" font-family="Excalifont, cursive">S_WAIT_TENSORCNT 1</text>
<text x="846" y="278" font-size="11.5" text-anchor="start" fill="#868e96" font-weight="normal">tile 2 has landed;</text>
<text x="846" y="294" font-size="11.5" text-anchor="start" fill="#868e96" font-weight="normal">tile 3 keeps moving</text>
<text x="720.0" y="443.0" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal" font-style="italic">in this slot tile 2 is still arriving</text>
<text x="720.0" y="458.62" font-size="12.5" text-anchor="middle" fill="#495057" font-weight="normal" font-style="italic">while tile 1 is being computed</text>
<rect x="96" y="492" width="868" height="92" rx="12" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="530" y="524.67" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">Two buffers, so the arriving tile never lands on the one being read.</text>
<text x="530" y="540.92" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">The wait is ≤ 1 rather than = 0: it retires the older transfer and leaves the newer one running.</text>
<text x="530" y="557.17" font-size="13" text-anchor="middle" fill="#495057" font-weight="normal">Waiting for = 0 would drain the engine every iteration and the two lanes would stop overlapping.</text>
</svg>
