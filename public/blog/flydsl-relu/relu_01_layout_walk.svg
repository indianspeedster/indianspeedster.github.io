  <text x="20" y="28" font-size="20" text-anchor="start" fill="#1e1e1e" font-weight="600">The layout walk — cut into columns, take my column, twice</text>
  <text x="20" y="73" font-size="14" text-anchor="start" fill="#868e96">X : 12 elements  (each number IS an element index)</text>
  <text x="48" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">0</text>
  <text x="108" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">1</text>
  <text x="168" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">2</text>
  <text x="228" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">3</text>
  <text x="288" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">4</text>
  <text x="348" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">5</text>
  <text x="408" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">6</text>
  <text x="468" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">7</text>
  <text x="528" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">8</text>
  <text x="588" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">9</text>
  <text x="648" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">10</text>
  <text x="708" y="114" font-size="14" text-anchor="middle" fill="#1e1e1e">11</text>
  <text x="215" y="178" font-size="14" text-anchor="start" fill="#2b8a3e">logical_divide(X, tile of 4)</text>
  <text x="20" y="233" font-size="14" text-anchor="start" fill="#868e96">columns are tiles</text>
  <text x="68" y="262" font-size="13" text-anchor="middle" fill="#868e96">tile 0</text>
  <text x="82" y="305" font-size="14" text-anchor="middle" fill="#1e1e1e">0</text>
  <text x="82" y="355" font-size="14" text-anchor="middle" fill="#1e1e1e">1</text>
  <text x="82" y="405" font-size="14" text-anchor="middle" fill="#1e1e1e">2</text>
  <text x="82" y="455" font-size="14" text-anchor="middle" fill="#1e1e1e">3</text>
  <text x="168" y="262" font-size="13" text-anchor="middle" fill="#2b8a3e">tile 1</text>
  <text x="182" y="305" font-size="14" text-anchor="middle" fill="#2b8a3e">4</text>
  <text x="182" y="355" font-size="14" text-anchor="middle" fill="#2b8a3e">5</text>
  <text x="182" y="405" font-size="14" text-anchor="middle" fill="#2b8a3e">6</text>
  <text x="182" y="455" font-size="14" text-anchor="middle" fill="#2b8a3e">7</text>
  <text x="268" y="262" font-size="13" text-anchor="middle" fill="#868e96">tile 2</text>
  <text x="282" y="305" font-size="14" text-anchor="middle" fill="#1e1e1e">8</text>
  <text x="282" y="355" font-size="14" text-anchor="middle" fill="#1e1e1e">9</text>
  <text x="282" y="405" font-size="14" text-anchor="middle" fill="#1e1e1e">10</text>
  <text x="282" y="455" font-size="14" text-anchor="middle" fill="#1e1e1e">11</text>
  <text x="20" y="502" font-size="13" text-anchor="start" fill="#868e96">down a column = consecutive memory</text>
  <text x="370" y="363" font-size="14" text-anchor="start" fill="#2b8a3e">slice(None, bid=1)</text>
  <text x="500" y="263" font-size="14" text-anchor="start" fill="#868e96">then again, one level down</text>
  <text x="542" y="292" font-size="13" text-anchor="middle" fill="#868e96">t0</text>
  <text x="542" y="335" font-size="14" text-anchor="middle" fill="#1e1e1e">4</text>
  <text x="642" y="292" font-size="13" text-anchor="middle" fill="#868e96">t1</text>
  <text x="642" y="335" font-size="14" text-anchor="middle" fill="#1e1e1e">5</text>
  <text x="742" y="292" font-size="13" text-anchor="middle" fill="#2b8a3e">t2</text>
  <text x="742" y="335" font-size="14" text-anchor="middle" fill="#2b8a3e">6</text>
  <text x="842" y="292" font-size="13" text-anchor="middle" fill="#868e96">t3</text>
  <text x="842" y="335" font-size="14" text-anchor="middle" fill="#1e1e1e">7</text>
  <text x="500" y="392" font-size="13" text-anchor="start" fill="#868e96">logical_divide(., 1) -&gt; columns are threads</text>
  <text x="500" y="422" font-size="13" text-anchor="start" fill="#868e96">slice(None, tid=2) -&gt; element 6</text>
  <text x="500" y="453" font-size="14" text-anchor="start" fill="#2b8a3e">check: bid*4 + tid = 1*4 + 2 = 6</text>
</svg>
