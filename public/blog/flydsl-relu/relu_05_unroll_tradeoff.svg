  <text x="20" y="28" font-size="20" text-anchor="start" fill="#1e1e1e" font-weight="600">Why the textbook move lost</text>
  <text x="20" y="75" font-size="16" text-anchor="start" fill="#868e96" font-weight="600">v2  ·  8 waves resident, 1 load each</text>
  <text x="20" y="177" font-size="13" text-anchor="start" fill="#868e96">8 independent waves to switch between while any one stalls</text>
  <text x="20" y="210" font-size="16" text-anchor="start" fill="#1e1e1e" font-weight="600">8 loads in flight</text>
  <text x="20" y="280" font-size="16" text-anchor="start" fill="#868e96" font-weight="600">v3  ·  unroll 4 — 4x the registers, so ~2 waves resident</text>
  <text x="540" y="325" font-size="16" text-anchor="start" fill="#1e1e1e" font-weight="600">8 loads in flight</text>
  <text x="540" y="353" font-size="14" text-anchor="start" fill="#868e96">identical memory-level parallelism ...</text>
  <text x="540" y="383" font-size="14" text-anchor="start" fill="#e03131">... but only 2 waves to hide anything else</text>
  <text x="20" y="438" font-size="14" text-anchor="start" fill="#e03131">measured: 7023 GB/s at unroll 1, 6543 at unroll 8 — monotonically worse</text>
